<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="30" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Hospital building body -->
  <rect x="12" y="32" width="40" height="26" rx="3" fill="url(#bld)"/>

  <!-- Building top arch / entrance -->
  <path d="M20 32 Q20 26 26 26 L38 26 Q44 26 44 32Z" fill="white" opacity="0.85"/>

  <!-- Door -->
  <rect x="27" y="46" width="10" height="12" rx="2" fill="#7c3aed" opacity="0.5"/>

  <!-- Left window -->
  <rect x="15" y="37" width="8" height="7" rx="1.5" fill="#7c3aed" opacity="0.3"/>

  <!-- Right window -->
  <rect x="41" y="37" width="8" height="7" rx="1.5" fill="#7c3aed" opacity="0.3"/>

  <!-- Medical cross — vertical bar -->
  <rect x="29.5" y="6" width="5" height="18" rx="2.5" fill="white"/>

  <!-- Medical cross — horizontal bar -->
  <rect x="23" y="12" width="18" height="5" rx="2.5" fill="white"/>
</svg>
