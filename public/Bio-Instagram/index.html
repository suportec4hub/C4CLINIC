<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C4Hub</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46.5 46.5'><path fill='%23EDEBE4' d='M0 37.21L8.28 22.9L0 8.59L8.79 8.59L17.07 22.9L8.79 37.21Z'/><path fill='%23EDEBE4' d='M45.79 8.59L37.51 22.9L45.79 37.21L37 37.21L28.72 22.9L37 8.59Z'/><path fill='%23EDEBE4' d='M37.21 45.79L22.89 37.52L8.58 45.79L8.58 37L22.89 28.73L37.21 37Z'/><path fill='%23EDEBE4' d='M8.58 0L22.89 8.28L37.21 0L37.21 8.79L22.89 17.07L8.58 8.79Z'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A1125;
      --card:      #101C3A;
      --surface:   #142040;
      --platina:   #EDEBE4;
      --platina-2: #C9C7C0;
      --platina-3: #9A98A0;
      --platina-low:#6A6A73;
      --gold:      #EDEBE4;
      --line:      rgba(237,235,228,0.08);
      --line-2:    rgba(237,235,228,0.14);
      --ease:      cubic-bezier(0.32,0.72,0,1);
      --ease-out:  cubic-bezier(0.16,1,0.3,1);
    }

    html { scroll-behavior: smooth; }

    /* Parallax via elemento fixo — funciona em iOS/Android/Desktop */
    .bg-layer {
      position: fixed;
      top: -5vh;
      left: 0;
      width: 100%;
      height: 112vh;
      z-index: 0;
      background:
        linear-gradient(rgba(10,17,37,0.3), rgba(10,17,37,0.3)),
        url('Banners Bio/background.png') center center / cover no-repeat;
      pointer-events: none;
    }

    body {
      background-color: var(--bg);
      color: var(--platina);
      font-family: 'Archivo', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      overflow-x: clip;
    }


    /* Layout */
    .bio {
      position: relative; z-index: 1;
      max-width: 460px;
      margin: 0 auto;
      padding: 3rem 1.35rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo */
    .bio-logo {
      margin-bottom: 1.75rem;
    }
    .bio-logo img {
      width: 150px;
      height: auto;
      display: block;
    }

    /* Bloco de apresentação */
    .bio-intro {
      text-align: center;
      margin-bottom: 2.25rem;
      max-width: 360px;
    }
    .intro-body {
      font-size: 1rem;
      font-weight: 500;
      color: var(--platina-2);
      line-height: 1.65;
      text-wrap: balance;
      margin-bottom: 1rem;
    }
    .intro-cta-text {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--platina-low);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-wrap: balance;
    }
    .intro-second {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--platina-3);
      line-height: 1.6;
      text-wrap: balance;
      margin-top: 0.6rem;
    }
    .intro-divider {
      width: 32px;
      height: 2px;
      background: var(--gold);
      border-radius: 2px;
      margin: 1rem auto 0;
      opacity: 0.6;
    }

    /* Cards de banner */
    .bio-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .bio-card {
      --cc: 237, 235, 228;
      display: block;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card);
      text-decoration: none;
      position: relative;
      transition: transform 0.55s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.45s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    /* Cor por card */
    .bio-card:nth-child(1) { --cc: 237, 235, 228; }
    .bio-card:nth-child(2) { --cc: 237, 235, 228; }
    .bio-card:nth-child(3) { --cc: 237, 235, 228; }

    /* Hover desktop */
    @media (hover: hover) {
      .bio-card:hover {
        transform: scale(1.05);
        box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 40px rgba(var(--cc), 0.38);
        outline: none;
        z-index: 2;
      }

      /* Push: card 1 hovered → cards 2 e 3 descem */
      .bio-links:has(.bio-card:nth-child(1):hover) .bio-card:nth-child(2),
      .bio-links:has(.bio-card:nth-child(1):hover) .bio-card:nth-child(3) {
        transform: translateY(12px);
      }

      /* Push: card 2 hovered → card 1 sobe, card 3 desce */
      .bio-links:has(.bio-card:nth-child(2):hover) .bio-card:nth-child(1) {
        transform: translateY(-12px);
      }
      .bio-links:has(.bio-card:nth-child(2):hover) .bio-card:nth-child(3) {
        transform: translateY(12px);
      }

      /* Push: card 3 hovered → cards 1 e 2 sobem */
      .bio-links:has(.bio-card:nth-child(3):hover) .bio-card:nth-child(1),
      .bio-links:has(.bio-card:nth-child(3):hover) .bio-card:nth-child(2) {
        transform: translateY(-12px);
      }
    }
    /* Mobile: glow quando entra na zona central */
    .bio-card.in-view {
      transform: scale(1.025);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 30px rgba(var(--cc), 0.28);
    }
    .bio-card:active { transform: scale(0.97); }
    .bio-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Botão WhatsApp */
    .bio-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: #1DAF51;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .bio-whatsapp:hover,
    .bio-whatsapp:focus-visible {
      background: #25D366;
      transform: scale(1.015);
      box-shadow: 0 8px 28px rgba(37,211,102,0.4);
      outline: none;
    }
    .bio-whatsapp:active {
      transform: scale(0.985);
    }
    .bio-whatsapp svg {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
    }

    /* Divisor antes do WhatsApp */
    .bio-sep {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 0.5rem 0;
    }

    /* Rodapé */
    .bio-footer {
      margin-top: 2.5rem;
      text-align: center;
    }
    .ig-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      border: 1px solid rgba(237,235,228,0.55);
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.02em;
      background: rgba(10,17,37,0.82);
      backdrop-filter: blur(6px);
      transition:
        border-color 0.35s ease,
        background 0.35s ease,
        color 0.3s ease,
        box-shadow 0.45s ease,
        transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ig-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .ig-btn:hover {
      border-color: var(--gold);
      background: rgba(237,235,228,0.15);
      color: #fff;
      transform: scale(1.14);
      box-shadow: 0 0 28px rgba(237,235,228,0.42);
    }

    /* Footer do site */
    .site-footer {
      width: 100%;
      background: rgba(5,9,18,0.82);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(237,235,228,0.06);
      padding: 1.1rem 2rem;
      position: relative;
      z-index: 1;
    }
    .site-footer-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--platina-2);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .footer-copy {
      font-size: 0.72rem;
      color: var(--platina-low);
      letter-spacing: 0.01em;
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(36px) scale(0.97);
      filter: blur(8px);
      transition:
        opacity 0.85s var(--ease-out),
        transform 0.85s var(--ease-out),
        filter 0.6s var(--ease-out);
      will-change: transform, opacity;
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      will-change: auto;
    }
    /* Após reveal completar, restaura transition rápida para hover */
    .bio-card.reveal.in {
      transition: transform 0.55s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.45s var(--ease);
    }
    .d1 { transition-delay: 0.05s; }
    .d2 { transition-delay: 0.15s; }
    .d3 { transition-delay: 0.25s; }
    .d4 { transition-delay: 0.35s; }
    .d5 { transition-delay: 0.45s; }
    .d6 { transition-delay: 0.55s; }


    /* Desktop */
    @media (min-width: 600px) {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3.5rem 0 0;
      }
      .bio {
        flex: 1;
        max-width: 960px;
        width: 100%;
        padding: 4rem 3rem 3.5rem;
      }
      .bio-logo img { width: 230px; }
      .bio-logo { margin-bottom: 2.25rem; }
      .bio-intro { max-width: 700px; margin-bottom: 2.75rem; }
      .intro-body { font-size: 1.25rem; font-weight: 600; line-height: 1.7; }
      .intro-second { font-size: 1rem; margin-top: 0.75rem; }
      .intro-divider { margin-top: 1.5rem; width: 48px; height: 3px; }
      .bio-links { gap: 1.5rem; }
      .bio-card { border-radius: 12px; }
      .bio-footer { margin-top: 3rem; }
      .ig-btn { font-size: 0.9rem; padding: 0.75rem 1.5rem; }
      .ig-btn svg { width: 18px; height: 18px; }

    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true"></div>

  <main class="bio">

    <!-- Logo -->
    <div class="bio-logo reveal d1">
      <img src="Banners Bio/logo-cinza.png" alt="C4Hub">
    </div>

    <!-- Bloco de apresentação -->
    <!-- COPY: Lucas, edite os textos abaixo -->
    <div class="bio-intro reveal d2">
      <p class="intro-body">
        Ajudamos empresas a vender mais com estratégia, tráfego pago e as ferramentas certas para transformar atenção digital em cliente de verdade.
      </p>
      <div class="intro-divider"></div>
    </div>

    <!-- Banners + WhatsApp -->
    <div class="bio-links">

      <a href="https://www.c4os.com.br/" class="bio-card reveal d3" target="_blank" rel="noopener noreferrer">
        <img src="Banners Bio/banner-c4os.png" alt="C4OS" loading="lazy">
      </a>

      <a href="https://c4hub.com.br/Trafego-Pago" class="bio-card reveal d4" target="_blank" rel="noopener noreferrer">
        <img src="Banners Bio/banner-trafego.png" alt="Gestão de Tráfego Pago" loading="lazy">
      </a>

      <a
        href="https://wa.me/5562982054815?text=Ol%C3%A1%2C%20quero%20mais%20vendas%20de%20verdade%20para%20o%20meu%20neg%C3%B3cio"
        class="bio-card reveal d5"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="Banners Bio/banner-whatsapp.png" alt="Fale Direto Conosco" loading="lazy">
      </a>

    </div>

    <!-- Rodapé -->
    <footer class="bio-footer reveal d6">
      <a href="https://instagram.com/c4hub_" target="_blank" rel="noopener noreferrer" class="ig-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
        @c4hub_
      </a>
    </footer>

  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-brand">
        <svg width="18" height="18" viewBox="0 0 46.5 46.5" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EDEBE4" d="M0 37.21L8.28 22.9L0 8.59L8.79 8.59L17.07 22.9L8.79 37.21Z"/>
          <path fill="#EDEBE4" d="M45.79 8.59L37.51 22.9L45.79 37.21L37 37.21L28.72 22.9L37 8.59Z"/>
          <path fill="#EDEBE4" d="M37.21 45.79L22.89 37.52L8.58 45.79L8.58 37L22.89 28.73L37.21 37Z"/>
          <path fill="#EDEBE4" d="M8.58 0L22.89 8.28L37.21 0L37.21 8.79L22.89 17.07L8.58 8.79Z"/>
        </svg>
        <span>C4HUB</span>
      </div>
      <p class="footer-copy">© 2026 C4Hub · Hub de marketing e vendas em Goiânia</p>
    </div>
  </footer>

  <script>
    history.scrollRestoration = 'manual';

    // Reveal on scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); observer.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Parallax desktop — fundo sobe 8% da velocidade do scroll (direção correta = profundidade)
    if (window.matchMedia('(pointer: fine)').matches) {
      const bgEl = document.querySelector('.bg-layer');
      let pRaf = null;
      window.addEventListener('scroll', () => {
        if (!pRaf) pRaf = requestAnimationFrame(() => {
          bgEl.style.transform = 'translateY(' + (-window.scrollY * 0.08) + 'px)';
          pRaf = null;
        });
      }, { passive: true });
    }

    // Mobile: scale quando card entra na zona central da tela
    if (window.matchMedia('(pointer: coarse)').matches) {
      const focusObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          e.target.classList.toggle('in-view', e.isIntersecting);
        });
      }, { rootMargin: '-22% 0px -22% 0px', threshold: 0.1 });
      document.querySelectorAll('.bio-card').forEach(c => focusObs.observe(c));
    }

  </script>

</body>
</html>
